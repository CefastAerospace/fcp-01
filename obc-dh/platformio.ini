[platformio]
default_envs = obc
src_dir = src
include_dir = headers
test_dir = tests

[env:obc]
platform = espressif32@6.6.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<bench/> -<PayloadUart.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.0.4
    sandeepmistry/LoRa@0.8.0
    symlink://../tt-c
extra_scripts = pre:tools/PatchArduinoJson.py

[env:int005-as5600-check]
extends = env:obc
build_flags = -DOBC_AS5600_BENCH -DOBC_BUFFERED_FRAMEWORK_LOG -Wl,--wrap=log_printfv -fstack-usage
build_src_filter = ${env:obc.build_src_filter} +<bench/ObcAs5600Check.cpp>

[env:int005-bh1750-check]
extends = env:obc
build_flags = -DOBC_BH1750_BENCH -DOBC_BUFFERED_FRAMEWORK_LOG -Wl,--wrap=log_printfv -fstack-usage
build_src_filter = ${env:obc.build_src_filter} +<bench/ObcBh1750Check.cpp>

[env:int005-mpu9250-check]
extends = env:obc
build_flags = -DOBC_MPU9250_BENCH -DOBC_BUFFERED_FRAMEWORK_LOG -Wl,--wrap=log_printfv -fstack-usage
build_src_filter = ${env:obc.build_src_filter} +<bench/ObcMpu9250Check.cpp>

; INT-009: somente este ambiente inicia aquisição INA219, sem TM EPS operacional.
[env:int009-ina219-check]
extends = env:obc
lib_deps =
    ${env:obc.lib_deps}
    symlink://../eps-tc/EPS_INA219_Standard
build_flags = -DOBC_EPS_BENCH -fstack-usage

; INT-009: cinco LM75A provisórios, somente RAM/USB; não habilita INA219.
[env:int009-lm75a-check]
extends = env:obc
lib_deps =
    ${env:obc.lib_deps}
    symlink://../eps-tc/LM75A_Standard
build_flags = -DOBC_THERMAL_BENCH -DOBC_BUFFERED_FRAMEWORK_LOG -Wl,--wrap=log_printfv -fstack-usage

[env:uart-loopback]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<PayloadUart.cpp> +<bench/UartLoopback.cpp>

[env:tes006-sd-check]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<ObcStorage.cpp> +<ObcStorageEsp32.cpp> +<bench/StorageHardwareCheck.cpp>

[env:uart-receiver-check]
extends = env:obc
lib_deps = bblanchon/ArduinoJson@7.0.4
build_src_filter = -<*> +<ObcData.cpp> +<ObcRecordCodec.cpp> +<ObcTime.cpp> +<ObcTimeEsp32.cpp> +<ObcTaskHealth.cpp> +<PayloadReceiver.cpp> +<PayloadReceiverEsp32.cpp> +<bench/PayloadReceiverCheck.cpp>
board_build.embed_txtfiles = payload.json
build_flags = -fstack-usage

[env:int006-check]
extends = env:obc
build_src_filter = +<*> -<main.cpp> -<bench/> -<PayloadUart.cpp> +<bench/ObcDataFlowCheck.cpp>
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowFixtures.py
board_build.embed_files = .pio/flow-fixtures.fcpu
build_flags = -DOBC_FLOW_BENCH -fstack-usage

[env:int006-delivery-check]
extends = env:int006-check
build_flags = -DOBC_FLOW_BENCH -DOBC_DELIVERY_BENCH -fstack-usage

[env:int006-ttc-check]
extends = env:int006-delivery-check
build_flags = -DOBC_FLOW_BENCH -DOBC_DELIVERY_BENCH -DOBC_TTC_INTEGRATION_BENCH -fstack-usage

[env:int007-modes-check]
extends = env:int006-ttc-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_MODES_BENCH

[env:int010-protection-check]
extends = env:int007-modes-check
build_flags = ${env:int007-modes-check.build_flags} -DOBC_PROTECTION_BENCH

[env:int006-drops-check]
extends = env:int006-ttc-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_RECORD_DROPS_BENCH

[env:int006-stress-check]
extends = env:int006-ttc-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_STRESS_BENCH

; INT-009: bancada conjunta, SD/Payload simulados; obc e bancadas individuais preservados.
[env:int009-housekeeping-check]
extends = env:int006-ttc-check
lib_deps =
    ${env:obc.lib_deps}
    symlink://../eps-tc/EPS_INA219_Standard
    symlink://../eps-tc/LM75A_Standard
build_src_filter = ${env:int006-check.build_src_filter} +<bench/HousekeepingCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_EPS_BENCH -DOBC_THERMAL_BENCH -DOBC_HOUSEKEEPING_BENCH

; Mesmo caminho de TM/diário; somente este ambiente substitui as leituras por fixtures.
[env:int009-housekeeping-fixtures-check]
extends = env:int009-housekeeping-check
build_flags = ${env:int009-housekeeping-check.build_flags} -DOBC_HOUSEKEEPING_FIXTURES

; INT-009: operações reais, sensores ausentes e diário simulado com aquisição FCP4.
[env:int009-acquisition-records-check]
extends = env:int009-housekeeping-check
build_flags = ${env:int009-housekeeping-check.build_flags} -DOBC_ACQUISITION_RECORDS_BENCH -DOBC_BUFFERED_FRAMEWORK_LOG -Wl,--wrap=log_printfv

[env:int008-storage-check]
extends = env:int006-ttc-check
build_src_filter = ${env:int006-check.build_src_filter} +<bench/DeliveryRecoveryCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_STORAGE_RECOVERY_BENCH

[env:int008-health-check]
extends = env:int006-ttc-check
build_src_filter = ${env:int006-check.build_src_filter} +<bench/TaskHealthCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_TASK_HEALTH_BENCH

[env:int008-i2c-health-check]
extends = env:int006-ttc-check
build_src_filter = ${env:int006-check.build_src_filter} +<bench/I2cHealthCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_I2C_HEALTH_BENCH -DOBC_I2C_RECOVERY_CHECK

[env:int008-resources-check]
extends = env:int006-ttc-check
build_src_filter = ${env:int006-check.build_src_filter} +<bench/ResourcesCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_RESOURCES_BENCH

[env:int006-capacity-check]
extends = env:int006-ttc-check
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowLimitsFixtures.py
board_build.embed_files = .pio/capacity-fixtures.fcpu
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_CAPACITY_BENCH

[env:int006-memory-check]
extends = env:int006-ttc-check
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowLimitsFixtures.py
board_build.embed_files = .pio/memory-fixtures.fcpu
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_MEMORY_BENCH

; INT-012: cenários isolados, sem comando de injeção no firmware normal.
[env:int012-watchdog-check]
extends = env:int006-ttc-check
build_src_filter = ${env:int006-check.build_src_filter} +<bench/WatchdogCheck.cpp>
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=0

[env:int012-uart-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=1

[env:int012-process-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=2

[env:int012-writer-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=3

[env:int012-i2c-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=4

[env:int012-ttc-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=5

[env:int012-supervisor-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=6

[env:int012-startup-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=7

[env:int012-resume-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=8

[env:int012-ack-full-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=9

[env:int012-reset-blocked-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=10

[env:int012-arm-error-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=11

[env:int012-timer-error-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=12

[env:int012-schedule-error-check]
extends = env:int012-watchdog-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_WATCHDOG_ENABLED -DOBC_WATCHDOG_BENCH_CASE=13

[env:int012-memory-check]
extends = env:int006-memory-check
build_flags = ${env:int006-memory-check.build_flags} -DOBC_WATCHDOG_ENABLED

[env:int012-waits-check]
extends = env:int008-health-check
build_flags = ${env:int008-health-check.build_flags} -DOBC_WATCHDOG_ENABLED

[env:i2c-recovery-check]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<I2cBus.cpp> +<I2cRecovery.cpp> +<bench/I2cRecoveryCheck.cpp>
build_flags = -DOBC_I2C_RECOVERY_CHECK -fstack-usage
