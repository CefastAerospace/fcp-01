[platformio]
default_envs = obc
src_dir = src
include_dir = headers
test_dir = tests

[env:obc]
platform = espressif32@6.6.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<bench/> -<PayloadUart.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.0.4
    sandeepmistry/LoRa@0.8.0
    symlink://../tt-c
extra_scripts = pre:tools/PatchArduinoJson.py

[env:uart-loopback]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<PayloadUart.cpp> +<bench/UartLoopback.cpp>

[env:uart-receiver-check]
extends = env:obc
lib_deps = bblanchon/ArduinoJson@7.0.4
build_src_filter = -<*> +<ObcData.cpp> +<ObcRecordCodec.cpp> +<ObcTime.cpp> +<ObcTimeEsp32.cpp> +<PayloadReceiver.cpp> +<PayloadReceiverEsp32.cpp> +<bench/PayloadReceiverCheck.cpp>
board_build.embed_txtfiles = payload.json
build_flags = -fstack-usage

[env:int006-check]
extends = env:obc
build_src_filter = +<*> -<main.cpp> -<bench/> -<PayloadUart.cpp> +<bench/ObcDataFlowCheck.cpp>
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowFixtures.py
board_build.embed_files = .pio/flow-fixtures.fcpu
build_flags = -DOBC_FLOW_BENCH -fstack-usage

[env:int006-delivery-check]
extends = env:int006-check
build_flags = -DOBC_FLOW_BENCH -DOBC_DELIVERY_BENCH -fstack-usage

[env:int006-ttc-check]
extends = env:int006-delivery-check
build_flags = -DOBC_FLOW_BENCH -DOBC_DELIVERY_BENCH -DOBC_TTC_INTEGRATION_BENCH -fstack-usage

[env:int006-stress-check]
extends = env:int006-ttc-check
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_STRESS_BENCH

[env:int006-capacity-check]
extends = env:int006-ttc-check
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowLimitsFixtures.py
board_build.embed_files = .pio/capacity-fixtures.fcpu
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_CAPACITY_BENCH

[env:int006-memory-check]
extends = env:int006-ttc-check
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowLimitsFixtures.py
board_build.embed_files = .pio/memory-fixtures.fcpu
build_flags = ${env:int006-ttc-check.build_flags} -DOBC_MEMORY_BENCH

[env:i2c-recovery-check]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<I2cBus.cpp> +<I2cRecovery.cpp> +<bench/I2cRecoveryCheck.cpp>
build_flags = -DOBC_I2C_RECOVERY_CHECK -fstack-usage
