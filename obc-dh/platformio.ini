[platformio]
default_envs = obc
src_dir = src
include_dir = headers
test_dir = tests

[env:obc]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<bench/> -<PayloadUart.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.0.4
    sandeepmistry/LoRa@0.8.0
    symlink://../tt-c
extra_scripts = pre:tools/PatchArduinoJson.py

[env:uart-loopback]
extends = env:obc
lib_deps =
extra_scripts =
build_src_filter = -<*> +<PayloadUart.cpp> +<bench/UartLoopback.cpp>

[env:uart-receiver-check]
extends = env:obc
lib_deps = bblanchon/ArduinoJson@7.0.4
build_src_filter = -<*> +<ObcData.cpp> +<ObcRecordCodec.cpp> +<ObcTime.cpp> +<ObcTimeEsp32.cpp> +<PayloadReceiver.cpp> +<PayloadReceiverEsp32.cpp> +<bench/PayloadReceiverCheck.cpp>
board_build.embed_txtfiles = payload.json
build_flags = -fstack-usage

[env:int006-check]
extends = env:obc
build_src_filter = +<*> -<main.cpp> -<bench/> -<PayloadUart.cpp> +<bench/ObcDataFlowCheck.cpp>
extra_scripts =
    pre:tools/PatchArduinoJson.py
    pre:tools/BuildFlowFixtures.py
board_build.embed_files = .pio/flow-fixtures.fcpu
build_flags = -DOBC_FLOW_BENCH -fstack-usage

[env:int006-delivery-check]
extends = env:int006-check
build_flags = -DOBC_FLOW_BENCH -DOBC_DELIVERY_BENCH -fstack-usage
