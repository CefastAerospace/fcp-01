; Firmware de teste do enlace TT&C no lado do satélite.
; Roda o módulo Ttc no hardware do OBC, com respostas mínimas aos TCs e envio
; periódico de JSON simulado de aeronaves. Par: tt-c/ground-station.
; Uso: pio run -t upload --upload-port /dev/ttyUSBx

[env:link-test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../../../obc-dh/headers
lib_deps =
	symlink://../..
