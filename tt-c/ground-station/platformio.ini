; Ponte da estação terrena do FCP-01 (ESP32 + SX1276): serial do notebook <-> LoRa.
; Protocolo e driver de rádio vêm da biblioteca tt-c (pasta pai); interface em app/
; Uso: pio run -t upload --upload-port /dev/ttyUSBx

[env:ground-station]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	symlink://..
