; Testes automatizados da biblioteca tt-c.
; - native: contrato JSON (TtcProtocol), sem hardware; requer g++. Uso: pio test -e native
; - esp32: Ttc com rádio falso, na placa. Uso: pio test -e esp32
; Os firmwares ficam em examples/link-test e ground-station.

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env:native]
platform = native
build_flags = -std=gnu++17
build_src_filter = -<*> +<TtcProtocol.cpp>
test_build_src = yes
test_filter = test_protocol
lib_deps =
	bblanchon/ArduinoJson@^7.0.0

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
test_build_src = yes
test_filter = test_ttc
lib_deps =
	sandeepmistry/LoRa@^0.8.0
	bblanchon/ArduinoJson@^7.0.0
